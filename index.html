<!DOCTYPE html>
<html lang="zh-Hant" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <meta name="googlebot" content="notranslate" />
  <meta name="theme-color" content="#426eb4" />
  <meta name="description" content="培智智學平台教師小遊戲主頁" />
  <title>培智智學平台</title>
  <style>
    :root {
      --bg: #e8f3fc;
      --bg-deep: #d7eaf8;
      --surface: #ffffff;
      --ink: #4a5563;
      --ink-strong: #2f3b4c;
      --muted: #6b7785;
      --line: #c9dced;
      --line-soft: #dceaf5;
      --accent: #426eb4;
      --accent-2: #3a63a4;
      --accent-soft: #99c6dd;
      --accent-wash: #e5f3ff;
      --accent-ink: #2f4f8a;
      --shadow: 0 10px 28px rgba(66, 110, 180, 0.10);
      --shadow-hover: 0 16px 36px rgba(66, 110, 180, 0.16);
      --radius: 16px;
      --radius-sm: 12px;
      --touch: 48px;
      --font: Arial, "微軟正黑體", "Microsoft JhengHei", "PingFang HK", "Noto Sans TC", "Open Sans", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --z-nav: 20;
      --z-skip: 40;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100dvh;
      background:
        radial-gradient(1200px 480px at 12% -10%, rgba(153, 198, 221, 0.45), transparent 60%),
        radial-gradient(900px 420px at 100% 0%, rgba(66, 110, 180, 0.12), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, #f5f9fc 42%, #eef4f9 100%);
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: text;
      user-select: text;
      text-rendering: optimizeLegibility;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    a { color: inherit; text-decoration: none; }
    button {
      font: inherit;
      border: 0;
      background: none;
      cursor: pointer;
      color: inherit;
    }
    img { display: block; max-width: 100%; }
    :focus-visible {
      outline: 3px solid rgba(66, 110, 180, 0.55);
      outline-offset: 3px;
    }

    .skip {
      position: absolute;
      left: 1rem;
      top: 0.75rem;
      z-index: var(--z-skip);
      transform: translateY(-140%);
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }
    .skip:focus {
      transform: translateY(0);
      outline: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.15rem 0 3rem;
    }

    header.hero {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.45rem;
      margin-bottom: 1.1rem;
      padding: 1.15rem 1.25rem 1.2rem;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.88));
      border: 1px solid var(--line-soft);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
      width: 100%;
    }
    .brand-mark {
      width: 10px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-soft) 100%);
      box-shadow: 0 4px 12px rgba(66, 110, 180, 0.28);
      flex: 0 0 auto;
    }
    .school-name {
      margin: 0;
      font-size: clamp(1.2rem, 2.5vw, 1.55rem);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--accent-ink);
      text-wrap: balance;
    }
    .hero-tag {
      margin: 0 0 0 1.15rem;
      max-width: 36rem;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      font-weight: 600;
      line-height: 1.45;
      text-wrap: pretty;
    }

    .toolbar {
      position: sticky;
      top: 0.55rem;
      z-index: var(--z-nav);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.4rem;
      margin-bottom: 1.05rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(66, 110, 180, 0.06);
    }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 44px;
      padding: 0 0.95rem;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.94rem;
      border: 1px solid transparent;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab-dot {
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      background: var(--cat, #8aa0b5);
      flex: 0 0 auto;
    }
    .tab:hover {
      background: var(--accent-wash);
      color: var(--accent-ink);
    }
    .tab:active { transform: none; }
    .tab.active {
      background: var(--accent-wash);
      color: var(--accent-ink);
      border-color: #b7d2ea;
      box-shadow: none;
    }
    .tab.active .tab-dot {
      background: var(--cat, var(--accent));
      box-shadow: none;
    }
    .tab:focus-visible { outline-offset: 2px; }

    .tab[data-id="lang"], .card[data-cat="lang"] { --cat: #c56a4a; }
    .tab[data-id="math"], .card[data-cat="math"] { --cat: #3f8a5c; }
    .tab[data-id="ict"], .card[data-cat="ict"] { --cat: #426eb4; }
    .tab[data-id="sci"], .card[data-cat="sci"] { --cat: #2d8f8b; }
    .tab[data-id="life"], .card[data-cat="life"] { --cat: #b87a2b; }
    .tab[data-id="art"], .card[data-cat="art"] { --cat: #6d629e; }
    .tab[data-id="music"], .card[data-cat="music"] { --cat: #b0537d; }
    .tab[data-id="pe"], .card[data-cat="pe"] { --cat: #cc7c34; }
    .tab[data-id="all"] { --cat: #6b7f94; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.1rem 0 0.85rem;
      padding: 0 0.1rem;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-ink);
    }
    .count { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(66, 110, 180, 0.07);
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card:hover {
      border-color: #b7d2e8;
      box-shadow: 0 10px 24px rgba(66, 110, 180, 0.12);
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #dceaf5;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .thumb-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-ink);
      opacity: 0.55;
      padding: 1rem;
      text-align: center;
      line-height: 1.35;
    }

    .body {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 0.85rem;
      padding: 0.95rem 1rem 1rem;
      min-height: 0;
    }
    .copy { display: grid; gap: 0.3rem; align-content: start; }
    .cat-line {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .cat-line .tab-dot {
      width: 0.42rem;
      height: 0.42rem;
    }
    .title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.4;
      font-weight: 800;
      color: var(--ink-strong);
    }
    .parent-info {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .author {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.7rem;
      align-items: center;
    }
    .open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 1rem;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: none;
      transition: background 0.15s ease;
    }
    .open-btn:hover {
      background: var(--accent-2);
      box-shadow: none;
    }
    .open-btn:active { transform: none; }

    .qr-box {
      width: 84px;
      height: 84px;
      padding: 6px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 2.4rem 1.2rem;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.72);
      border: 1px dashed #c5d8e8;
      border-radius: var(--radius);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(100% - 1.05rem, 100%);
        padding-top: 0.85rem;
        padding-bottom: 2.2rem;
      }
      header.hero {
        padding: 0.9rem 1rem;
        border-radius: 14px;
      }
      .toolbar {
        border-radius: 12px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .toolbar::-webkit-scrollbar { display: none; }
      .tab { white-space: nowrap; flex: 0 0 auto; }
      .grid { grid-template-columns: 1fr; gap: 0.9rem; }
      .actions { grid-template-columns: 1fr; }
      .qr-box {
        width: 96px;
        height: 96px;
        justify-self: start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }

    @media print {
      body { background: #fff; }
      body::before { display: none; }
      .toolbar { position: static; box-shadow: none; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#grid">跳至遊戲列表</a>
  <div class="wrap">
    <header class="hero">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <p class="school-name" id="schoolName">培智智學平台</p>
      </div>
      <p class="hero-tag" id="heroTag">喺屋企同小朋友一齊玩學習遊戲</p>
    </header>

    <nav class="toolbar" id="tabs" aria-label="科目分類"></nav>

    <div class="section-head">
      <h2 id="sectionTitle">全部</h2>
      <div class="count" id="sectionCount"></div>
    </div>

    <main class="grid" id="grid" aria-live="polite"></main>
  </div>

  <script>
    /* =========================================================
       只改呢度（GAMES_DATA）
       visible: false = 預留，頁面唔顯示
       thumb: 可填圖片網址，或留空用首字
       ========================================================= */
    const GAMES_DATA = {
      school: "培智智學平台",
      tagline: "喺屋企同小朋友一齊玩學習遊戲",
      title: "",
      categories: [
        {
          id: "lang",
          name: "語文",
          visible: true,
          games: [
            {
              title: "火字部大挑戰",
              url: "https://www.puichi.edu.hk/it-school/php/webcms/files/upload/tinymce//2026_2027/bottom/_radical_game_1790577999.html",
              thumb: "https://www.puichi.edu.hk/it-school/php/webcms/files/upload/tinymce//2026_2027/bottom/mar_1790582751.png",
              author: "",
              desc: "中文科部首遊戲",
              parent: "家中大約 10 分鐘"
            }
          ]
        },
        {
          id: "math",
          name: "數學",
          visible: true,
          games: []
        },
        {
          id: "ict",
          name: "電腦",
          visible: true,
          games: []
        },
        /* 預留科目：visible:false 先唔顯示 */
        { id: "sci", name: "科學", visible: false, games: [] },
        { id: "life", name: "生活", visible: false, games: [] },
        { id: "art", name: "美藝", visible: false, games: [] },
        { id: "music", name: "音樂", visible: false, games: [] },
        { id: "pe", name: "體育", visible: false, games: [] }
      ]
    };
    /* ===================== 以上係資料區 ===================== */

    const state = { active: "all" };
    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function qrUrl(target) {
      return "https://api.qrserver.com/v1/create-qr-code/?size=168x168&margin=8&data=" +
        encodeURIComponent(target);
    }
    function safeText(v, fallback) {
      return (v == null || String(v).trim() === "") ? (fallback || "") : String(v);
    }
    function visibleCategories(data) {
      return (data.categories || []).filter((c) => c.visible !== false);
    }
    function allVisibleGames(data) {
      return visibleCategories(data).flatMap((cat) =>
        (cat.games || []).map((g) => ({
          ...g,
          categoryId: cat.id,
          categoryName: cat.name
        }))
      );
    }
    function gamesFor(data, active) {
      const all = allVisibleGames(data);
      if (active === "all") return all;
      return all.filter((g) => g.categoryId === active);
    }
    function initialFor(title) {
      return safeText(title, "?").trim().slice(0, 1);
    }

    function renderTabs(data) {
      const tabs = $("tabs");
      const cats = visibleCategories(data);
      const items = [{ id: "all", name: "全部" }].concat(
        cats.map((c) => ({ id: c.id, name: c.name }))
      );
      tabs.innerHTML = items.map((item) => {
        const on = item.id === state.active;
        return (
          '<button type="button" class="tab' + (on ? " active" : "") +
          '" data-id="' + escapeHtml(item.id) + '" aria-pressed="' + on + '">' +
          '<span class="tab-dot" aria-hidden="true"></span>' +
          escapeHtml(item.name) + "</button>"
        );
      }).join("");
      tabs.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", function () {
          state.active = btn.getAttribute("data-id");
          render();
        });
      });
    }

    function renderCards(list) {
      const grid = $("grid");
      if (!list.length) {
        grid.innerHTML = '<div class="empty">暫時未有遊戲，稍後再睇。</div>';
        return;
      }
      grid.innerHTML = list.map((g) => {
        const title = safeText(g.title, "未命名遊戲");
        const url = safeText(g.url, "#");
        const desc = safeText(g.desc, "");
        const author = safeText(g.author, "");
        const thumb = safeText(g.thumb, "");
        const cat = safeText(g.categoryName, "");
        const catId = safeText(g.categoryId, "");
        const parent = safeText(g.parent, "");

        const t = escapeHtml(title);
        const u = escapeHtml(url);
        const thumbHtml = thumb
          ? (
              '<img src="' + escapeHtml(thumb) + '" alt="' + t + '" loading="lazy" ' +
              'onerror="this.style.display=\'none\';' +
              'var f=this.parentNode.querySelector(\'.thumb-fallback\');' +
              'if(f) f.hidden=false;" />' +
              '<div class="thumb-fallback" hidden>' + escapeHtml(cat || title) + "</div>"
            )
          : '<div class="thumb-fallback">' + escapeHtml(cat || title) + "</div>";

        return (
          '<article class="card" data-cat="' + escapeHtml(catId) + '">' +
            '<div class="thumb">' + thumbHtml + "</div>" +
            '<div class="body">' +
              '<div class="copy">' +
                (cat
                  ? '<div class="cat-line"><span class="tab-dot" aria-hidden="true"></span>' +
                    escapeHtml(cat) + "</div>"
                  : "") +
                '<h3 class="title">' + t + "</h3>" +
                (parent ? '<p class="parent-info">' + escapeHtml(parent) + "</p>" : "") +
                (desc ? '<p class="desc">' + escapeHtml(desc) + "</p>" : "") +
                (author ? '<div class="author">' + escapeHtml(author) + "</div>" : "") +
              "</div>" +
              '<div class="actions">' +
                '<a class="open-btn" href="' + u +
                '" target="_blank" rel="noopener noreferrer">開始</a>' +
                '<div class="qr-box" title="掃碼打開">' +
                  '<img src="' + qrUrl(url) + '" alt="' + t +
                  ' QR" loading="lazy" />' +
                "</div>" +
              "</div>" +
            "</div>" +
          "</article>"
        );
      }).join("");
    }

    function renderMeta(data) {
      const cats = visibleCategories(data);
      $("schoolName").textContent = safeText(data.school, "培智智學平台");
      document.title = $("schoolName").textContent;
      const tag = $("heroTag");
      if (tag) tag.textContent = safeText(data.tagline, "喺屋企同小朋友一齊玩學習遊戲");

      const activeName =
        state.active === "all"
          ? "全部"
          : ((cats.find((c) => c.id === state.active) || {}).name || "全部");
      $("sectionTitle").textContent = activeName;
      const count = $("sectionCount");
      if (count) count.textContent = "";
    }

    function render() {
      renderTabs(GAMES_DATA);
      renderMeta(GAMES_DATA);
      renderCards(gamesFor(GAMES_DATA, state.active));
    }

    render();
  </script>
</body>
</html>
